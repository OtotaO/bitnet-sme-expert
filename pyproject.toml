[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dspy-sme-expert"
version = "3.0.0"
description = "DSPy-powered multi-expert SME system with FastAPI, MLflow tracing, LiteLLM routing, and optional bitnet.cpp local inference"
authors = [{ name = "SUM Equities", email = "hi@sumequities.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["dspy", "llm", "fastapi", "bitnet", "mlflow", "litellm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. Provider SDKs are pulled in transitively by `dspy` via
# litellm — we don't need them pinned at the application level.
dependencies = [
  # Web framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",

  # DSPy core stack
  "dspy>=3.2.0",
  "litellm>=1.55",
  "mlflow>=3.0",

  # Data + math
  "sympy>=1.13",
  "numpy>=2.0",

  # Persistence
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",

  # Operability
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "httpx>=0.28",
  "tenacity>=9.0",

  # AuthN/Z
  "pyjwt[crypto]>=2.10",
  "passlib[bcrypt]>=1.7.4",

  # Caching + rate limit
  "redis>=5.2",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
finetune = [
  "transformers>=4.46",
  "datasets>=3.0",
  "peft>=0.13",
  "trl>=0.12",
  "accelerate>=1.0",
]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "pre-commit>=4.0",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
homepage = "https://github.com/OtotaO/bitnet-sme-expert"
repository = "https://github.com/OtotaO/bitnet-sme-expert"
changelog = "https://github.com/OtotaO/bitnet-sme-expert/blob/main/CHANGELOG.md"

[project.scripts]
dspy-sme = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist", "compiled"]

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "C4",           # comprehensions
  "UP",           # pyupgrade
  "SIM",          # simplify
  "PL",           # pylint
  "RUF",          # ruff-specific
  "ASYNC",        # async best practices
  "S",            # bandit
]
ignore = [
  "S101",         # asserts ok in tests
  "PLR0913",      # arg count
  "PLR2004",      # magic value
  "E501",         # line length handled by formatter
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sympy.*", "slowapi.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "eval: DSPy evaluation tests (require LM access; skipped by default)",
  "slow: slow integration tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:litellm.*",
  "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
