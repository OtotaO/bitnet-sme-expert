[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dspy-sme-expert"
version = "3.0.0"
description = "DSPy-powered multi-expert SME system with FastAPI, MLflow tracing, LiteLLM routing, and optional bitnet.cpp local inference"
authors = [{ name = "SUM Equities", email = "hi@sumequities.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["dspy", "llm", "fastapi", "bitnet", "mlflow", "litellm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. Provider SDKs are pulled in transitively by `dspy` via
# litellm — we don't need them pinned at the application level.
dependencies = [
  # Web framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",

  # DSPy core stack
  "dspy>=3.2.1",
  "litellm>=1.55",
  "mlflow>=3.0",

  # Data + math
  "sympy>=1.13",
  "numpy>=2.0",

  # Persistence
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",

  # Operability
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "httpx>=0.28",
  "tenacity>=9.0",

  # AuthN/Z
  "pyjwt[crypto]>=2.10",
  "passlib[bcrypt]>=1.7.4",

  # Caching + rate limit
  "redis>=5.2",
  "slowapi>=0.1.9",

  # Security floor for a transitive dep (pulled via dspy -> inscriptis/ir-datasets).
  # Pins past PYSEC-2026-87 (fixed in 6.1.0); not imported directly.
  "lxml>=6.1.0",

  # Security floor for a transitive dep (pulled via pyjwt[crypto]).
  # Pins past PYSEC-2026-3552 (fixed in 50.0.0); not imported directly.
  # This is what has failed the weekly Security Scans run since 2026-08-10.
  "cryptography>=50.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
# MIPROv2 (the default optimizer in `make optimize-*`) searches the
# instruction/demo space with Optuna; dspy keeps it as an optional dependency.
optimize = ["optuna>=3.6"]
# Optional MCP server (Model Context Protocol) exposing the experts as tools.
# The official SDK is `mcp` (not the third-party `fastmcp`).
mcp = ["mcp>=1.27.0"]
finetune = [
  "transformers>=4.46",
  "datasets>=3.0",
  "peft>=0.13",
  "trl>=0.12",
  "accelerate>=1.0",
]
rag = [
  # Embedded vector + FTS store. Multivector + native hybrid + ColBERT reranker.
  "lancedb>=0.13",
  "pyarrow>=18.0",
  # BGE-M3 (dense + sparse + multi-vec) and BGE-Reranker-v2-m3 cross-encoder.
  # Both are pulled via huggingface on first use; no extra registry config.
  "FlagEmbedding>=1.3",
  "sentence-transformers>=3.3",
  "torch>=2.5",
]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "pre-commit>=4.0",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
homepage = "https://github.com/OtotaO/bitnet-sme-expert"
repository = "https://github.com/OtotaO/bitnet-sme-expert"
changelog = "https://github.com/OtotaO/bitnet-sme-expert/blob/main/CHANGELOG.md"

[project.scripts]
dspy-sme = "app.cli:main"
dspy-sme-mcp = "app.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist", "compiled"]

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "C4",           # comprehensions
  "UP",           # pyupgrade
  "SIM",          # simplify
  "PL",           # pylint
  "RUF",          # ruff-specific
  "ASYNC",        # async best practices
  "S",            # bandit
]
ignore = [
  "S101",         # asserts ok in tests
  "PLR0913",      # arg count
  "PLR2004",      # magic value
  "E501",         # line length handled by formatter
  "B008",         # FastAPI Depends() is the idiomatic default
  "PLC0415",      # lazy imports are intentional throughout (optional deps)
]
unfixable = ["B"]

[tool.ruff.lint.pylint]
max-statements = 60
max-branches = 18
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Tests routinely lazy-import to avoid loading heavy DSPy modules eagerly.
"tests/**" = ["S", "PLR2004", "PLC0415"]
# Scripts are entry points; subprocess and lazy imports are intentional.
"scripts/**" = ["S603", "S607", "PLC0415", "E402"]
# Config holds dev defaults like 0.0.0.0 host / placeholder secrets; bandit
# warns are noise here, the real secret loading is via environment.
"app/config.py" = ["S104", "S105", "S106", "S107"]
# Entry-point CLI uses lazy imports + module-level side effects.
"app/cli.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sympy.*", "slowapi.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "eval: DSPy evaluation tests (require LM access; skipped by default)",
  "slow: slow integration tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:litellm.*",
  "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
