repos:
  # Ruff replaces black + isort + flake8 + pyupgrade in one tool (2026 standard).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.9, fastapi, types-redis]
        args: [--ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  # Billing-immune local CI: GitHub Actions billing-blocks at the account level,
  # silently killing CI. The hooks above are the lint/format/typecheck half of
  # ci.yml but run only at commit time. This pre-push stage mirrors ci.yml's TEST
  # job so the full suite runs locally before any push (zero Actions minutes).
  # Register it once with: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: pytest-ci-mirror
        name: pytest (CI mirror, pre-push)
        entry: uv run pytest tests --ignore=tests/eval
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

ci:
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autofix_prs: true
  autoupdate_schedule: monthly
