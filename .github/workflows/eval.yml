name: Eval

# DSPy eval against the gold datasets. Runs automatically on every PR to main
# (required pre-merge gate) and can also be triggered manually with a specific
# domain / model. On a PR it posts the per-domain score table as a comment and
# uploads JSON + stdout as an artifact for downstream consumption.
#
# On a PR the eval only runs when an OPENAI_API_KEY secret is available — fork
# PRs (which never receive secrets) skip the eval step and the job still passes
# green, so the required check never blocks a contributor who can't hold keys.
#
# Examples:
#   gh workflow run eval.yml --field domain=math --field lm=openai/gpt-4o-mini
#   gh workflow run eval.yml --ref claude/my-branch --field pr_number=12

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain:
        description: "Which gold dataset to evaluate"
        type: choice
        required: true
        default: all
        options: [all, math, code, general]
      lm:
        description: "LiteLLM model string (DSPY_LM_<ROLE>)"
        type: string
        required: false
        default: openai/gpt-4o-mini
      threshold:
        description: "Override the per-domain pass threshold (blank = use defaults: math/code=0.6, general=0.7)"
        type: string
        required: false
        default: ""
      pr_number:
        description: "Optional PR number to post results to as a comment"
        type: string
        required: false
        default: ""

concurrency:
  group: eval-${{ github.ref }}-${{ inputs.domain || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write  # required to post the results comment

jobs:
  eval:
    # Stable job name → stable required-status-check context ("eval"), matching
    # the contexts list in branch-protection.yml. Don't fold the domain into the
    # name or the required check would never match on a PR run.
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Forward inputs as env vars rather than interpolating directly into
      # shell commands — prevents injection from a maliciously-crafted input.
      # `inputs.*` is empty on a pull_request event, so fall back to the PR
      # defaults (eval everything against the cheap model).
      EVAL_DOMAIN: ${{ inputs.domain || 'all' }}
      EVAL_LM: ${{ inputs.lm || 'openai/gpt-4o-mini' }}
      EVAL_THRESHOLD: ${{ inputs.threshold || '' }}
      # Manual dispatch can name a PR; otherwise use the PR that triggered us.
      EVAL_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
      # Secrets can't be referenced in `if:`, but the *result* of comparing one
      # can — this exposes only a boolean, never the key itself. Fork PRs get no
      # secrets, so this is 'false' there and the eval step is skipped.
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras

      - name: Skip notice (no OpenAI key)
        if: env.HAS_OPENAI_KEY != 'true'
        run: |
          echo "::notice::No OPENAI_API_KEY available (e.g. a fork PR) — skipping eval. The gate passes without running."

      - name: Run eval
        id: eval
        if: env.HAS_OPENAI_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: dspy-sme-expert-eval
        run: |
          set +e
          THRESHOLD_FLAG=()
          if [ -n "$EVAL_THRESHOLD" ]; then
            THRESHOLD_FLAG=(--threshold "$EVAL_THRESHOLD")
          fi
          uv run python scripts/run_eval.py \
            --domain "$EVAL_DOMAIN" \
            --lm "$EVAL_LM" \
            --output eval-results.json \
            "${THRESHOLD_FLAG[@]}" \
            | tee eval-stdout.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload results artifact
        if: always() && env.HAS_OPENAI_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.domain || 'all' }}-${{ github.run_id }}
          path: |
            eval-results.json
            eval-stdout.txt
          if-no-files-found: warn

      - name: Post results to PR
        if: always() && env.HAS_OPENAI_KEY == 'true' && env.EVAL_PR_NUMBER != ''
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lm = process.env.EVAL_LM || '(unknown)';
            const runId = process.env.RUN_ID;
            const prNumber = parseInt(process.env.EVAL_PR_NUMBER, 10);
            let results = [];
            try {
              results = JSON.parse(fs.readFileSync('eval-results.json', 'utf8'));
            } catch (err) {
              core.warning(`No eval-results.json found: ${err.message}`);
              results = [];
            }
            const rows = results.map(r => {
              const mark = r.passed ? ':white_check_mark:' : ':x:';
              const errSuffix = r.error ? ` (error: \`${r.error}\`)` : '';
              return `| \`${r.domain}\` | ${r.n} | **${r.score.toFixed(2)}** | ${r.threshold.toFixed(2)} | ${mark}${errSuffix} |`;
            }).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const body = [
              `### Eval results — \`${lm}\``,
              '',
              '| Domain | N | Score | Threshold | Pass |',
              '|---|---:|---:|---:|:---:|',
              rows || '| _no results_ | | | | |',
              '',
              `<sub>workflow run: [#${runId}](${runUrl})</sub>`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Fail on regression
        if: steps.eval.outputs.exit_code == '1'
        run: |
          echo "::error::One or more domains scored below threshold."
          exit 1

      - name: Fail on setup error
        if: steps.eval.outputs.exit_code == '2'
        run: |
          echo "::error::Eval setup failed (bad domain, missing dataset, or LM error)."
          exit 2
