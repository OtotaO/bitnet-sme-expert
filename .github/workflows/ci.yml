name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check app tests scripts

      - name: Ruff (format)
        run: uv run ruff format --check app tests scripts

      - name: Mypy
        run: uv run mypy app
        continue-on-error: true  # Type coverage tightens incrementally.

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests --ignore=tests/eval --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build-container:
    name: build-container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build --target production -t dspy-sme-expert:ci .
