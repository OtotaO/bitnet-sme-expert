name: Security Scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

jobs:
  security:
    name: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # project requires >=3.12; 3.11 fails `pip install -e .`

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install bandit pip-audit

      - name: Run Bandit (fail on high severity)
        run: bandit -r app/ -lll -iii

      - name: Run dependency audit
        # diskcache CVE-2025-69872 has no fixed release yet; it is a transitive
        # dep of dspy used only for local LM-response caching, not exposed to
        # untrusted input here. Suppressed with a dated note; drop the ignore
        # once a fixed diskcache ships. (lxml PYSEC-2026-87 is pinned out in
        # pyproject, so it is not ignored here.)
        run: pip-audit --ignore-vuln CVE-2025-69872
